reason-blacklist:
  #- COMMAND

# 生物有多大的概率不按照配置文件定义的类型，随机选择属性生成
variation-rate: 0.05

mobs:

  # atk类型： normal(常规，默认值，可不写), burst(爆发), piercing(贯通), mystic(神秘), decompose(分解)
  # def类型： # normal(常规装甲，默认值，可不写), light(轻装甲), heavy(重装甲), special(特殊装甲), composite(复合装甲)

  # ==========================================
  # 【主世界：黑夜的诅咒 (The Undead & Night)】
  # ==========================================
  
  ZOMBIE:
    atk: normal    # 徒手挥击，最基础的物理伤害
    def: light     # 腐烂的血肉，极度畏惧爆发(剑/矛)的切割
# 如果生物以某种原因生成,则用下面的配置覆盖
#    override:
#      COMMAND:
#        atk: normal
#        def: light
    
  HUSK:
    atk: normal
    def: heavy     # 尸壳：被沙漠风干硬化的躯体，像披着一层沙结石护甲（弱贯通）

  SKELETON:
    atk: piercing  # 弓箭射击
    def: heavy     # 纯粹的骨骼支撑，没有血肉缓冲，免疫爆发切割，极度畏惧重锤(分解)震碎
    
  STRAY:
    atk: piercing  # 迟缓箭矢
    def: light     # 流浪者：穿着破烂的布衣防寒（柔甲，弱爆发）
    
  CREEPER:
    atk: burst     # 爆炸产生大面积的撕裂与冲击
    def: light     # 植物般的柔软躯体
    
  SPIDER:
    atk: piercing  # 尖锐的毒牙刺穿护甲
    def: light     # 脆弱的节肢动物外壳

  CAVE_SPIDER:
    atk: mystic    # 洞穴蜘蛛的攻击附带强烈的毒素(魔法/法则伤害)
    def: light

  SLIME:
    atk: decompose # 巨大的体型砸地，产生钝器般的震荡波
    def: composite # 极具弹性的凝胶复合体，吸收穿刺和切割，只怕被钝器(分解)强行震散

  WITCH:
    atk: mystic    # 纯粹的魔法药水洗地
    def: light     # 肉体凡胎，穿着布袍（自带一定的魔法抵抗，极度畏惧物理爆发）

  # ==========================================
  # 【灾厄帝国：机械与暴力的结晶 (Illagers)】
  # ==========================================
  
  PILLAGER:
    atk: piercing  # 掠夺者：制式弩箭
    def: light     # 只穿着简单的皮革和布衣

  VINDICATOR:
    atk: decompose # 卫道士：手持极其致命的铁斧，疯狂的重劈
    def: light     # 放弃防御，追求极致的暴力

  EVOKER:
    atk: mystic    # 唤魔者：召唤地刺和尖牙，纯粹的黑魔法
    def: special   # 身上环绕着魔法护盾（秘甲，弱魔法同源过载，免疫普通钝器）

  VEX:
    atk: piercing  # 恼鬼：手持铁剑，但能穿透方块直接刺入身体
    def: special   # 幽灵灵体，物理武器难以命中，必须用魔法(神秘)消灭

  RAVAGER:
    atk: decompose # 劫掠兽：狂暴的冲撞和咆哮震荡
    def: composite # 披着厚重马鞍与致密厚皮的终极生化兵器（弱分解）

  ILLUSIONER:
    atk: mystic    # 攻击：虽然拿弓，但射出的是附带致盲与魔法力量的箭矢
    def: special   # 防御：你打的往往是他的幻影或魔法分身（秘甲，弱魔法，免疫物理爆发）

  IRON_GOLEM:
    atk: decompose # 铁傀儡：将敌人砸飞天际的重型机械拳
    def: heavy     # 纯铁打造的刚性躯体

  # ==========================================
  # 【下界：焦热的深渊 (The Nether)】
  # ==========================================

  ZOMBIFIED_PIGLIN:
    atk: burst     # 僵尸猪灵：手持金剑进行横扫切割
    def: light     # 腐烂的半血肉躯体
    
  PIGLIN:
    atk: piercing  # 猪灵：主武器是弩（虽然有时拿剑，但定调为远程穿透兵种）
    def: light

  PIGLIN_BRUTE:
    atk: decompose # 猪灵蛮兵：挥舞金斧的致命钝击者
    def: special   # 身上佩戴着大量的黄金臂铠和护盾（金属性=秘甲）

  BLAZE:
    atk: mystic    # 烈焰人：喷吐元素火球
    def: special   # 由旋转的烈焰棒和魔法力场构成（极度弱同源魔法）

  GHAST:
    atk: burst     # 恶魂：火球爆炸产生大面积物理破坏
    def: special   # 悬浮的灵魂体（秘甲）

  WITHER_SKELETON:
    atk: normal    # 凋灵骷髅：石剑挥砍（凋灵效果由原版机制结算，不叠加极化）
    def: heavy     # 碳化的坚硬骨骼

  MAGMA_CUBE:
    atk: decompose # 岩浆怪：沉重的岩浆岩砸击
    def: composite # 岩浆与岩石交织的复合体（极度弱分解震荡）

  # ==========================================
  # 【末地与深海：虚空与深渊的孑遗 (The End & Deep)】
  # ==========================================

  ENDERMAN:
    atk: decompose # 末影人(主世界/外岛)：极其沉重的手臂挥击
    def: special   # 虚空生物，自带偏转弹射物的空间力场（秘甲，极度畏惧魔法爆发）
    # 注：末地主岛的末影人需要在代码逻辑中被强制覆盖为 Random

  SHULKER:
    atk: mystic    # 潜影贝：发射反重力追踪魔法弹
    def: composite     # 坚不可摧的紫珀质甲壳（刚甲，需要贯通箭矢射穿缝隙）

  GUARDIAN:
    atk: mystic    # 守卫者：深海激光射线
    def: heavy     # 坚硬的石质外壳和尖刺（刚甲，免疫切割，弱贯通）

  ELDER_GUARDIAN:
    atk: mystic    # 远古守卫者：更强的凝视与挖掘疲劳咒语
    def: composite # 活了千万年的石化复合躯体，普通弓箭已无法穿透，必须用重锤(分解)震碎

  # ==========================================
  # 【特殊/不可名状之物 (Anomalies)】
  # ==========================================

  PHANTOM:
    atk: piercing  # 幻翼：高空俯冲的尖锐撕咬
    def: special   # 不眠者的梦魇具象化（幽灵态，弱神秘）

  WARDEN:
    atk: decompose # 监守者：足以秒杀一切的音波震荡与重拳
    def: composite # 幽匿脉络与白骨交织的终极复合生物


# ===========================
# 末影龙
# 尚未实现，目前只是简单的随机属性且无变化，未来会进一步实装
# ===========================
ENDER_DRAGON:
  rule:

    # 根据名字判断种类和强度
    # 种类前缀
    name:
      "frost":
        atk: burst
        def: composite
      "blazing":
        atk: piercing
        def: elastic
      "warp":
        atk: mystic
        def: special
      "last":
        atk: normal
        def: normal
      "Zombified":
        atk: decompose
        def: light
      "sculk":
        atk: viber
        def: composite
      "mossy":
        atk: mystic
        def: heavy

    # 等级前缀
    level:
      1:
        name: "Fledgeling"
      2:
        name: "Powerful"
      3:
        name: "Cruel"
      4:
        name: "Immortal"
      5:
        name: "Ferocious"
      6:
        name: "Primordial"